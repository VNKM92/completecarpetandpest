version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carpet-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - LARAVEL_API_URL=http://backend:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - carpet-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carpet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME="Brisbane Carpet & Pest API"
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
    volumes:
      - backend-storage:/var/www/html/storage
    networks:
      - carpet-network

  nginx:
    image: nginx:alpine
    container_name: carpet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - carpet-network

volumes:
  backend-storage:

networks:
  carpet-network:
    driver: bridge
