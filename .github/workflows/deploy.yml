name: Continuous Deployment (CD Pipeline)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: 🛡️ Pre-Deployment Verification
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 🚀 Zero-Downtime Deploy to Production Server
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Execute Zero-Downtime Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.HOSTINGER_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA,GITHUB_REF
          script: |
            echo "=========================================================="
            echo "🚀 Starting Automated Production Deployment: $(date)"
            echo "Commit: $GITHUB_SHA"
            echo "=========================================================="
            
            APP_DIR="/var/www/carpet"
            if [ ! -d "$APP_DIR" ]; then
              echo "❌ Error: Application directory $APP_DIR does not exist."
              exit 1
            fi
            
            cd "$APP_DIR"
            
            # Make all deployment scripts executable
            chmod +x scripts/*.sh || true
            
            # Run automated deployment workflow
            bash scripts/deploy.sh
            
            # Run post-deployment health check
            bash scripts/health-check.sh

      - name: 📢 Deployment Status Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment succeeded for commit ${{ github.sha }}!"
          else
            echo "❌ Deployment failed for commit ${{ github.sha }}. Check server logs."
          fi
